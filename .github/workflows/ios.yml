# Build the splitchat iPhone app (splitchat D56).
#
# Runs only by hand, through the hub's infra/scripts/splitchat/release-ios.sh:
#   - upload=false (the default): an unsigned Simulator build of any source
#     ref, which proves the iOS project compiles. Needs no Apple account.
#   - upload=true: a signed App Store build of an ios-vX.Y.Z tag, uploaded to
#     TestFlight. Needs the Apple secrets below; without them it fails.
#
# Secrets: SOURCE_DEPLOY_KEY (read-only key to the private source, shared with
# release.yml), and for uploads ASC_KEY_P8 / ASC_KEY_ID / ASC_ISSUER_ID (an
# App Store Connect API key with the Admin role, which automatic signing
# needs) and APPLE_TEAM_ID.
#
# These logs are public. Xcode's log goes to a file and only its error lines
# are printed (or its last lines, if none match), and nothing is uploaded as an
# artifact. A failed build's errors can still quote private file paths and
# source lines, as release.yml's do; secrets never appear.
name: iOS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "splitchat source ref: main, a commit SHA, or an ios-vX.Y.Z tag (required to upload)"
        required: true
        default: main
      upload:
        description: "Sign and upload to TestFlight"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail; GitHub's default for `run` has no pipefail

concurrency:
  group: ios
  cancel-in-progress: false

jobs:
  ios:
    # Expo SDK 57 needs Xcode 26.4+; macos-15 stops at 26.3.
    runs-on: macos-26
    timeout-minutes: 90
    env:
      XCODE: /Applications/Xcode_26.6.app
      # App Store Connect wants a new build number per upload; this run's
      # number only grows. The app reports it to the server as ios/<n>.
      IOS_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check the inputs
        env:
          REF: ${{ inputs.ref }}
          UPLOAD: ${{ inputs.upload }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          tag='^ios-v[0-9]+\.[0-9]+\.[0-9]+$'
          [[ "$REF" =~ $tag || "$REF" =~ ^(main|[0-9a-f]{40})$ ]] || { echo "::error::ref must be main, a full SHA or ios-vX.Y.Z"; exit 1; }
          if [ "$UPLOAD" = true ]; then
            [[ "$REF" =~ $tag ]] || { echo "::error::uploads build an ios-vX.Y.Z tag"; exit 1; }
            # A re-run keeps the run number, which App Store Connect has seen.
            [ "$ATTEMPT" = 1 ] || { echo "::error::re-run uploads reuse the build number; use release-ios.sh --resume"; exit 1; }
          fi

      - name: Apple secrets are set
        if: inputs.upload
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for v in ASC_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -z "$missing" ] || { echo "::error::not set in this repo's secrets:$missing"; exit 1; }

      - name: Xcode
        run: |
          # xc <name> <xcodebuild args…>: the full log goes to a file; on
          # failure, only its error lines (or its last lines) are printed.
          cat > "$RUNNER_TEMP/xc.sh" <<'SH'
          xc() {
            local log="$RUNNER_TEMP/$1.log" errors
            shift
            xcodebuild "$@" > "$log" 2>&1 && return 0
            errors=$(grep -E "error:|\*\* [A-Z]+ FAILED|Command .* failed" "$log" | head -80 || true)
            if [ -n "$errors" ]; then echo "$errors"; else tail -30 "$log"; fi
            return 1
          }
          SH
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"
          if [ ! -d "$XCODE" ]; then
            echo "::error::$XCODE isn't on this image; installed:"; ls -d /Applications/Xcode* ; exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stackedtensor/splitchat
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Version matches the tag
        if: startsWith(inputs.ref, 'ios-v')
        env:
          REF: ${{ inputs.ref }}
        run: |
          v=$(jq -r .expo.version mobile/app.json)
          [ "ios-v$v" = "$REF" ] || { echo "::error::app.json says $v, tag is $REF"; exit 1; }

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Generate the iOS project
        working-directory: mobile
        run: |
          npx expo prebuild --platform ios --clean --no-install
          (cd ios && pod install) > "$RUNNER_TEMP/pods.log" 2>&1 || { tail -60 "$RUNNER_TEMP/pods.log"; exit 1; }
          ws=$(ls -d ios/*.xcworkspace)
          [ "$(echo "$ws" | wc -l)" -eq 1 ] || { echo "::error::expected one workspace, found: $ws"; exit 1; }
          echo "WORKSPACE=$PWD/$ws" >> "$GITHUB_ENV"
          echo "SCHEME=$(basename "$ws" .xcworkspace)" >> "$GITHUB_ENV"

      - name: Simulator build (unsigned)
        if: ${{ !inputs.upload }}
        working-directory: mobile
        run: |
          . "$RUNNER_TEMP/xc.sh"
          xc build -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build
          ls -d "$RUNNER_TEMP"/dd/Build/Products/Release-iphonesimulator/*.app

      - name: Signed archive
        if: inputs.upload
        working-directory: mobile
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          . "$RUNNER_TEMP/xc.sh"
          mkdir -m 700 "$(dirname "$ASC_KEY_PATH")"
          (umask 077 && printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH")
          xc archive -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic archive

      - name: Upload to TestFlight
        if: inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          . "$RUNNER_TEMP/xc.sh"
          plist="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xc export -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "uploaded build $IOS_BUILD_NUMBER"

      - name: Remove the Apple key
        if: always()
        run: rm -rf "$(dirname "$ASC_KEY_PATH")"
