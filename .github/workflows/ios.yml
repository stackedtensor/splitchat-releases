# Build the splitchat iPhone app (splitchat D56).
#
# Runs only by hand, through the hub's infra/scripts/splitchat/release-ios.sh:
#   - upload=false (the default): an unsigned Simulator build of any source
#     ref, which proves the iOS project compiles. Needs no Apple account.
#   - upload=true: a signed App Store build of an ios-vX.Y.Z tag, uploaded to
#     TestFlight. Needs the Apple secrets below; without them it fails.
#
# Secrets: SOURCE_DEPLOY_KEY (read-only key to the private source, shared with
# release.yml), and for uploads ASC_KEY_P8 / ASC_KEY_ID / ASC_ISSUER_ID (an
# App Store Connect API key with the Admin role, which automatic signing
# needs) and APPLE_TEAM_ID.
#
# These logs are public: the Xcode log goes to a file and only its error lines
# are printed, and nothing is uploaded as an artifact.
name: iOS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "splitchat source ref: main, a commit SHA, or an ios-vX.Y.Z tag (required to upload)"
        required: true
        default: main
      upload:
        description: "Sign and upload to TestFlight"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios
  cancel-in-progress: false

jobs:
  ios:
    # Expo SDK 57 needs Xcode 26.4+; macos-15 stops at 26.3.
    runs-on: macos-26
    timeout-minutes: 90
    env:
      XCODE: /Applications/Xcode_26.6.app
      # App Store Connect wants a new build number per upload; this run's
      # number only grows. The app reports it to the server as ios/<n>.
      IOS_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check the inputs
        env:
          REF: ${{ inputs.ref }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          if [ "$UPLOAD" = true ]; then
            [[ "$REF" =~ ^ios-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::uploads build an ios-vX.Y.Z tag"; exit 1; }
          else
            [[ "$REF" =~ ^(main|[0-9a-f]{40}|ios-v[0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "::error::ref must be main, a full SHA or ios-vX.Y.Z"; exit 1; }
          fi

      - name: Apple secrets are set
        if: inputs.upload
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for v in ASC_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -z "$missing" ] || { echo "::error::not set in this repo's secrets:$missing"; exit 1; }

      - name: Xcode
        run: |
          if [ ! -d "$XCODE" ]; then
            echo "::error::$XCODE isn't on this image; installed:"; ls -d /Applications/Xcode* ; exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stackedtensor/splitchat
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Version matches the tag
        if: startsWith(inputs.ref, 'ios-v')
        env:
          REF: ${{ inputs.ref }}
        run: |
          v=$(jq -r .expo.version mobile/app.json)
          [ "ios-v$v" = "$REF" ] || { echo "::error::app.json says $v, tag is $REF"; exit 1; }

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Generate the iOS project
        working-directory: mobile
        run: |
          npx expo prebuild --platform ios --clean --no-install
          (cd ios && pod install) > "$RUNNER_TEMP/pods.log" 2>&1 || { tail -60 "$RUNNER_TEMP/pods.log"; exit 1; }
          ws=$(ls -d ios/*.xcworkspace)
          [ "$(echo "$ws" | wc -l)" -eq 1 ] || { echo "::error::expected one workspace, found: $ws"; exit 1; }
          echo "WORKSPACE=$PWD/$ws" >> "$GITHUB_ENV"
          echo "SCHEME=$(basename "$ws" .xcworkspace)" >> "$GITHUB_ENV"

      - name: Simulator build (unsigned)
        if: ${{ !inputs.upload }}
        working-directory: mobile
        run: |
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build \
            > "$RUNNER_TEMP/xcode.log" 2>&1 || {
              grep -E "error:|\*\* BUILD FAILED|Command .* failed" "$RUNNER_TEMP/xcode.log" | head -80 || tail -30 "$RUNNER_TEMP/xcode.log"
              exit 1
            }
          ls -d "$RUNNER_TEMP"/dd/Build/Products/Release-iphonesimulator/*.app

      - name: Signed archive
        if: inputs.upload
        working-directory: mobile
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          key="$RUNNER_TEMP/asc/AuthKey.p8"
          mkdir -m 700 "$RUNNER_TEMP/asc"
          (umask 077 && printf '%s\n' "$ASC_KEY_P8" > "$key")
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key"
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/app.xcarchive" \
            "${auth[@]}" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic archive \
            > "$RUNNER_TEMP/xcode.log" 2>&1 || {
              grep -E "error:|\*\* ARCHIVE FAILED|Command .* failed" "$RUNNER_TEMP/xcode.log" | head -80 || tail -30 "$RUNNER_TEMP/xcode.log"
              exit 1
            }

      - name: Upload to TestFlight
        if: inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          plist="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$RUNNER_TEMP/export.log" 2>&1 || {
              grep -iE "error|fail" "$RUNNER_TEMP/export.log" | head -60
              exit 1
            }
          echo "uploaded build $IOS_BUILD_NUMBER; it shows in TestFlight once Apple has processed it"

      - name: Remove the Apple key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
